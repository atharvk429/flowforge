spring:
  application:
    name: flowforge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowforge}
    username: ${DB_USERNAME:flowforge}
    password: ${DB_PASSWORD:flowforge_dev}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
